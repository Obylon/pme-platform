spring:
  application:
    name: web-frontend
  threads:
    virtual:
      enabled: true
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 1h

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
