global:
  imageRegistry: ghcr.io/obylon
  imageTag: 10c65ba6ee0c9e9d5a950158e1cd27c2849f0bde
  imagePullPolicy: IfNotPresent
  host: pme.local
  gateway: pme-gateway
  oidc:
    issuerUri: https://pme.local/auth/realms/pme
    jwkSetUri: http://keycloak.pme.svc.cluster.local:8080/auth/realms/pme/protocol/openid-connect/certs
    audience: pme-api
  postgres:
    host: pme-pg-rw
    port: 5432
  rabbitmq:
    host: pme-rabbit.pme.svc.cluster.local
    port: 5672
    secret: pme-rabbit-default-user

services:
  community-service:
    pathPrefix: /api/community
    database: community
    amqp: true
    replicas: 2
    autoscaling: { minReplicas: 2, maxReplicas: 5, cpuUtilization: 70 }
  notification-service:
    pathPrefix: /api/notifications
    database: notification
    amqp: true
    replicas: 2
    autoscaling: { minReplicas: 2, maxReplicas: 4, cpuUtilization: 70 }
  shop-service:
    pathPrefix: /api/shop
    database: shop
    amqp: false
    replicas: 2
    autoscaling: { minReplicas: 2, maxReplicas: 6, cpuUtilization: 70 }

  web-frontend:
    pathPrefix: /          # site web ; /api/* et /auth/* restent routés vers leurs services (préfixe le plus long)
    replicas: 1
    autoscaling: { minReplicas: 1, maxReplicas: 3, cpuUtilization: 70 }
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }

resources:
  requests: { cpu: 250m, memory: 384Mi }
  limits: { cpu: "1", memory: 768Mi }
