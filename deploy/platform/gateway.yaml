# Point d'entrée unique (Gateway API + Envoy Gateway) : terminaison TLS, redirection HTTP -> HTTPS,
# limitation de débit. Les HTTPRoutes des services sont déclarées par le chart pme-app et par keycloak.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: pme-gateway
  namespace: pme
  annotations:
    cert-manager.io/cluster-issuer: pme-ca   # cert-manager crée et renouvelle le secret pme-tls
spec:
  gatewayClassName: envoy
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: pme.local
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: pme-tls
      allowedRoutes:
        namespaces:
          from: Same
    - name: http
      protocol: HTTP
      port: 80
      hostname: pme.local
      allowedRoutes:
        namespaces:
          from: Same
---
# Toute requête HTTP en clair est redirigée en HTTPS (301)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https
  namespace: pme
spec:
  parentRefs:
    - name: pme-gateway
      sectionName: http
  hostnames: ["pme.local"]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# Protection contre l'abus et le déni de service applicatif : plafond global de requêtes
# par instance Envoy. Limite connue : pas de quota par IP cliente (nécessite le rate limit
# global d'Envoy Gateway adossé à Redis) -> traité dans le plan de remédiation.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: pme-rate-limit
  namespace: pme
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: pme-gateway
  rateLimit:
    type: Local
    local:
      rules:
        - limit:
            requests: 1000
            unit: Second
---
# TLS 1.2 minimum côté client
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: pme-client-policy
  namespace: pme
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: pme-gateway
  tls:
    minVersion: "1.2"
