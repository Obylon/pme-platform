# Autorité de certification interne pour l'environnement local :
# un émetteur auto-signé crée la CA racine, qui signe ensuite les certificats des Gateways.
# En production (cloud européen) : ClusterIssuer ACME Let's Encrypt (challenge HTTP-01 via Gateway API).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pme-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: PME Local Root CA
  secretName: pme-root-ca
  duration: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: pme-ca
spec:
  ca:
    secretName: pme-root-ca
