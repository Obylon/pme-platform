# Mises à jour automatiques des dépendances (KAN-27) : une PR groupée par écosystème chaque lundi.
# Chaque PR passe par le pipeline complet (tests, Sonar, Dependency-Check, Trivy) avant fusion.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns: ["org.springframework*", "io.micrometer*", "tools.jackson*", "com.fasterxml.jackson*"]
      others:
        patterns: ["*"]
        exclude-patterns: ["org.springframework*", "io.micrometer*", "tools.jackson*", "com.fasterxml.jackson*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: docker
    directory: /deploy
    schedule: { interval: weekly, day: monday }
