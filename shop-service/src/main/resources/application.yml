spring:
  application:
    name: shop-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shop}
    username: ${DB_USERNAME:shop}
    password: ${DB_PASSWORD:shop}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Clés publiques récupérées en interne au cluster ; l'émetteur (iss) est validé
          # par rapport à l'URL publique, celle que voient les clients.
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/auth/realms/pme/protocol/openid-connect/certs}
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/auth/realms/pme}
          audiences: ${OIDC_AUDIENCE:pme-api}
  threads:
    virtual:
      enabled: true

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,250ms,500ms,1s

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
